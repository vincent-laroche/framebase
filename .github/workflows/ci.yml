name: Framebase CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: framebase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test FramebaseKit
        run: swift test --package-path Packages/FramebaseKit

      - name: Build Framebase app
        run: |
          xcodebuild \
            -project Framebase.xcodeproj \
            -scheme Framebase \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
