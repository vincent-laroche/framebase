name: Framebase CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: framebase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test FramebaseKit
        run: swift test --package-path Packages/FramebaseKit

      - name: Build Framebase app and UI-test target
        run: |
          xcodebuild \
            -project Framebase.xcodeproj \
            -scheme Framebase \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Smoke-launch Framebase
        run: |
          open -n DerivedData/Build/Products/Debug/Framebase.app
          for attempt in {1..10}; do
            if pgrep -x Framebase >/dev/null; then
              pkill -x Framebase
              exit 0
            fi
            sleep 1
          done
          echo "Framebase did not remain running after launch" >&2
          exit 1
