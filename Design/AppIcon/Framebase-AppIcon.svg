<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Framebase application icon</title>
  <desc>Layered visual frames over a deep blue field, with a warm focal point.</desc>
  <defs>
    <linearGradient id="background" x1="122" y1="68" x2="887" y2="956" gradientUnits="userSpaceOnUse">
      <stop stop-color="#243D65"/>
      <stop offset="0.52" stop-color="#132744"/>
      <stop offset="1" stop-color="#091522"/>
    </linearGradient>
    <linearGradient id="backFrame" x1="262" y1="190" x2="775" y2="784" gradientUnits="userSpaceOnUse">
