  <rect width="1024" height="1024" fill="#0A1524"/>
  <rect x="56" y="56" width="912" height="912" rx="210" fill="url(#background)"/>
  <path d="M105 192C105 114 168 72 237 72H790C870 72 929 136 929 216V473C849 390 744 343 627 343C373 343 165 555 165 817C165 862 171 905 183 946C137 922 105 870 105 808V192Z" fill="#325786" fill-opacity="0.33"/>

